# Mutants of the sandbox guards (scripts/sandbox/{sbx.sh,provision.sh,Containerfile}).
#
#   python3 scripts/dev/mutants.py list sandbox
#   python3 scripts/dev/mutants.py run sandbox [mutant ...]
#
# Every die-shaped line of the files in [scope] carries `# gate:<id>` (an id of [gates]) or
# `# not-a-gate: <reason>`; `just gate-tags` fails otherwise. A mutant replaces its `anchor`
# (exactly one occurrence, on a line tagged with its gate id) in a copy of the tree, and its
# `test`s must fail with every `expect_message`, `expect_failures` failing tests in all.
command = ["python3", "-m", "unittest"]
ran_line = '^Ran \d+ tests? in \d+\.\d+s$'
skip_marker = "skipped="
failure_marker = " (scripts.tests."
failure_exit = 1

[scope]
files = [
    "scripts/sandbox/sbx.sh",
    "scripts/sandbox/provision.sh",
    "scripts/sandbox/Containerfile",
]

[gates]
unverified-instance-removed = "a failed install removes the instance it made, so nothing unverified stays runnable"
die-exits = "die ends the step with status 1"
pins-file-present = "missing pins are an error, never an unpinned install"
pins-dir-column = "every pins row is five tab-separated fields with a known pack dir"
pins-match-manifest = "the pins list exactly the files of the zip's manifest"
pins-checked-before-install = "the pins are checked before anything is installed"
pack-files-dir = "the installed files are compared with their dir, not only name + sha256"
pack-files-nonempty = "an install with no pack files is a failure, also unpinned"
pack-files-match-pins = "the installed files are exactly the pinned files and bytes"
pack-verified-after-install = "the step verifies what the launcher (or the copy) installed"
from-copy-complete = "a --from copy that misses a pinned file fails and names it"
from-dir-shape = "--from must point at an instance with a mods/ folder"
from-dir-exists = "--from must name an existing directory"
from-outside-instance = "a --from dir inside the instance it would replace is refused"
instance-ownership = "an instance the step did not start is never removed"
launch-single-game = "no second game is launched from a data root that runs one"
click-geometry = "a dialog without readable geometry is never clicked blind"
import-untitled-dialog = "only the non-dialog window titled as the launcher is the main window"
import-fail-fatal = "an import failure ends the step"
import-own-display = "the import runs on its own X display, never the game's"
import-launcher-idle = "a running launcher of the root is never driven"
import-timeout = "an import that never commits times out"
import-log-failure = "a failure the launcher logs fails the import without any dialog"
import-launcher-alive = "a launcher that exits during the import fails it at once"
import-xdotool-return = "a Return that xdotool could not press fails the import"
import-dialog-timeout = "a New Instance dialog that ignores Return times out"
import-xdotool-click = "clicks xdotool could not make fail the import"
import-optional-timeout = "an optional-mods dialog that ignores the clicks times out"
import-blocked-window = "the Blocked mods dialog fails the import, also with nothing in the log"
import-unknown-window = "any other launcher window fails the import"
import-instance-name = "an instance created under another name fails the import"
import-curseforge-type = "the imported instance must be a CurseForge (flame) import"
launcher-no-flame-key = "the launcher is seeded never to fetch the CurseForge app's API key"
client-pinned = "the client is installed against its pins file"
fetch-sha256 = "a download with another sha256 fails and is moved aside"
wait-log-fail-pattern = "a fail line in a watched log is a failure"
wait-log-timeout = "a log without its ok line times out as a failure"
server-done = "a server that does not reach Done fails the step"
warmup-title = "a warm-up launch that misses the title screen fails"
warmup-mappings = "a warm-up without the Forge mappings fails"
warmup-jsm-services = "a warm-up that lost the jsMacros services fails"
repo-is-gerda = "a clone without ./gerda is refused"
repo-needs-verified-client = "repo never syncs into an unverified client instance"
repo-sync-deployed = "a sync that deployed no main.js fails"
world-server-sha1 = "a vanilla server jar with another sha1 fails"
world-level-dat = "a world generation without level.dat fails"
pack-instance-name = "a pack instance name is a plain name (no path)"
pack-sha-format = "a pack sha256 argument must be 64 hex digits"
pack-zip-sha256 = "a local pack zip with another sha256 is refused"
pack-url-needs-sha = "a pack url needs a sha256 (or --unpinned)"
add-mods-nonempty = "add-mods with no jar fails"
start-matrix-needs-verified-pack = "start-matrix never starts an unverified pack instance"
start-matrix-bridge = "start-matrix fails when the bridge never answers"
start-needs-verified-client = "start never starts an unverified client instance"
start-joined = "start fails when the bot did not join the server"
start-bridge = "start fails when the bridge never answers"
verify-ping = "verify fails when the bridge never answers 3 pings in a row"
verify-smoke = "verify fails when the smoke fails 3 times"
record-black-check = "a black recording fails the record step"
image-archive-sha256 = "the image build checks the bun and uv archives against their pins"
prov-die-exits = "provision.sh die ends with status 1"
prov-from-shape = "provision --from must point at an instance with a mods/ folder"
wait-step-rc = "provision wait fails on a failed step"
wait-still-running = "provision wait returns 3, not success, for a step still running"
prov-pack-instance-name = "provision pack refuses a non-plain name before any copy"
destroy-needs-yes = "destroy needs its --yes"
destroy-container-label = "destroy removes only a container `up` labelled"
destroy-volume-label = "destroy removes only a volume `up` labelled"
destroy-reports-failure = "a failed removal is reported as a failure"
up-labels = "up labels the container and the volumes it creates"
cache-key-by-url = "a download's cache file is keyed by its whole url, so two urls never share a file"
fetch-needs-pin = "a download with no sha256 pin is refused before it starts"
unpinned-only-pack = "the UNPINNED token skips the check only in the pack step"
pins-set = "every sha256 pin in pins.env is set (64 hex digits)"
dispatch-unknown-fails = "an unknown sbx.sh step prints the usage and fails"
prov-dispatch-unknown-fails = "an unknown provision.sh step prints the usage and fails"
verified-instance-kept = "a failure after the check never removes the verified instance"

