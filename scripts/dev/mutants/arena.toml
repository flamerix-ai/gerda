# Mutants of the arena check guards (scripts/dev/arena.py: checks, known-bad twins, spec
# validation). Same rules as sandbox.toml; [scope.python] names the functions the lint reads.
command = ["python3", "-m", "unittest"]
ran_line = '^Ran \d+ tests? in \d+\.\d+s$'
skip_marker = "skipped="
failure_marker = " (scripts.tests."
failure_exit = 1

[scope.python]
"scripts/dev/arena.py" = [
    "check_outcome",
    "wrong_outcome",
    "twin_index",
    "run_checks",
    "validate_arena_spec",
    "asserts",
]

[gates]
check-jeval-error = "a jeval error fails an unmarked check, with the error text"
check-value = "an unmarked check passes only on its exact expected value (canonical JSON)"
wrong-jeval-error = "a jeval error is no refusal of a wrong claim"
wrong-accepted = "a wrong claim that holds fails its check"
wrong-twin-passed = "a wrong check is refused only when its unmarked twin passed"
wrong-gets-right-value = "a wrong check passes only on its twin's right value (not null, not a third value)"
wrong-has-twin = "a wrong check needs exactly one unmarked twin with the same jeval"
wrong-twin-differs = "the twin states a value other than the wrong one"
checks-fold = "one failed check fails the check list"
spec-checks-list = "checks is a non-empty list"
spec-check-jeval = "every check has a non-empty jeval string"
spec-check-expect = "every check has an expect value"
spec-wrong-literal = "wrong is literally true or absent"
spec-known-bad-text = "known_bad names the wrong behaviour it asserts"
spec-known-bad-marks = "a known-bad arena marks a wrong check"
spec-wrong-needs-known-bad = "a wrong check only in a known-bad arena"
asserts-checks = "an arena with checks joins the full gate"
run-checks-wired = "every arena with checks runs them, with or without a mission"
load-validates = "loading an arena validates it before any build"
set-refuses-checks = "a film set carries no checks and no known_bad"

