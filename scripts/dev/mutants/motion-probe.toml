replace = "        if False:  # gate:min-luma-gates"
test = [
    "scripts.tests.test_motion_probe.LumaGateTests.test_a_black_take_FAILS_by_name",
]
expect_message = [
    "FAIL: test_a_black_take_FAILS_by_name (",
