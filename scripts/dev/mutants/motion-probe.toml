# Mutants of the --min-luma guard of scripts/rig/motion_probe.py and the verdict it rides on.
# Same rules as sandbox.toml; [scope.python] names the functions the lint reads.
command = ["python3", "-m", "unittest"]
ran_line = '^Ran \d+ tests? in \d+\.\d+s$'
skip_marker = "skipped="
failure_marker = " (scripts.tests."
failure_exit = 1

[scope.python]
"scripts/rig/motion_probe.py" = [
    "frame_luma",
    "gate_verdict",
]

[gates]
luma-no-frames = "no frames is an error, never a dark take"
probe-refuses-empty = "zero measurements REFUSE, never pass"
min-luma-gates = "--min-luma fails a take whose mean luma is under the bound"
max-static-gate = "--max-static fails a take with a longer freeze"
min-windows-gate = "--min-windows fails a take with too few live windows"
min-luma-needs-measurement = "--min-luma without a luma measurement REFUSES"
verdict-fail = "a failed gate is the fail verdict"
min-luma-finite = "a non-finite --min-luma is refused"
min-luma-wired = "the CLI measures luma and hands --min-luma to the verdict"

[[mutant]]
name = "luma-empty-unnamed"
gate = "luma-no-frames"
file = "scripts/rig/motion_probe.py"
anchor = "    if not frames:\n        raise ValueError(\"frame_luma: no frames\")"
replace = "    if False:\n        raise ValueError(\"frame_luma: no frames\")"
test = [
    "scripts.tests.test_motion_probe.LumaGateTests.test_no_frames_is_an_error_not_a_dark_take",
]
expect_message = [
    "FAIL: test_no_frames_is_an_error_not_a_dark_take (",
    "does not match",
]
expect_failures = 1

[[mutant]]
name = "empty-series-judged"
gate = "probe-refuses-empty"
file = "scripts/rig/motion_probe.py"
anchor = "    if int(result.get(\"samples\", 0)) < 1:"
replace = "    if False:"
test = [
    "scripts.tests.test_motion_probe.MinWindowsGateTests.test_an_empty_series_still_REFUSES_under_min_windows",
]
expect_message = [
    "FAIL: test_an_empty_series_still_REFUSES_under_min_windows (",
    "!= 'refuse'",
]
expect_failures = 1

[[mutant]]
name = "min-luma-report-only"
gate = "min-luma-gates"
file = "scripts/rig/motion_probe.py"
anchor = "min_windows is None and min_luma is None:"
replace = "min_windows is None:"
test = [
    "scripts.tests.test_motion_probe.LumaGateTests.test_a_black_take_FAILS_by_name",
]
expect_message = [
    "FAIL: test_a_black_take_FAILS_by_name (",
    "!= 'fail'",
]
expect_failures = 1

[[mutant]]
name = "min-luma-never-fails"
gate = "min-luma-gates"
